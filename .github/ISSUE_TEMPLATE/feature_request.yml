name: "💡 Feature Request"
description: "Suggest an idea or enhancement for ZenohX"
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make ZenohX better! Please describe your proposed feature or improvement.

  - type: textarea
    id: problem
    attributes:
      label: "Problem / Use Case"
      description: "Is your feature request related to a specific problem or workflow?"
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the solution you would like or envision."
      placeholder: "Add a button/option in the Query workspace that..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Solutions"
      description: "Have you considered any alternative solutions or workarounds?"
      placeholder: "Currently I work around this by..."

  - type: dropdown
    id: component
    attributes:
      label: "Relevant Component / Workspace"
      description: "Which area of ZenohX does this feature target?"
      options:
        - "Pub/Sub Workspace"
        - "Query & RPC Workspace"
        - "Traffic & Network Monitoring"
        - "Connection & Profile Manager"
        - "Scout / Multicast Discovery"
        - "Payload Viewer / Editor"
        - "Settings / Theme / Updater"
        - "Other / General CLI"

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Add any other context, mockups, or screenshots about the feature request here."
