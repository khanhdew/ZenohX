[package]
name = "zenohx"
version = "0.6.0"
description = "ZenohX - Modern, high-performance desktop GUI client for Eclipse Zenoh"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/khanhdew/ZenohX"
homepage = "https://github.com/khanhdew/ZenohX"
readme = "../README.md"
keywords = ["zenoh", "gui", "desktop", "robotics", "iot"]
categories = ["development-tools", "gui", "network-programming"]

[lib]
name = "zenohx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
zenoh = { version = "1.10.0", features = ["unstable"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
ciborium = "0.2"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
mdns-sd = "0.21.1"
if-addrs = "0.13"
futures = "0.3"

