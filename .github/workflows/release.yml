name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-release:
    name: Build & Publish Release (${{ matrix.platform }})
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Generate GitHub Release Notes
        id: release_notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          
          VERSION="${TAG#v}"
          
          # Fetch GitHub's native automated release notes
          NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="$TAG" --jq .body 2>/dev/null || true)
          
          HEADER=$(printf "**Version:** %s\n**Build Number:** %s\n**Commit:** %s" "$VERSION" "${{ github.run_number }}" "${{ github.sha }}")
          if [ -n "$NOTES" ]; then
            FULL_BODY="${HEADER}"$'\n\n'"${NOTES}"
          else
            CHANGES=$(git log -n 15 --oneline --no-merges)
            FULL_BODY="${HEADER}"$'\n\n'"### What's Changed"$'\n'"${CHANGES}"
          fi

          EOF_DELIMITER=$(openssl rand -hex 8)
          {
            echo "body<<${EOF_DELIMITER}"
            echo "$FULL_BODY"
            echo "${EOF_DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri Desktop App & Sign Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # The tag name from tauri.conf.json or git tag
          releaseName: 'ZenohX v__VERSION__'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
