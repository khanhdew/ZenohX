name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    name: Create Draft Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.release_id }}
      release_notes: ${{ steps.release_notes.outputs.body }}
      tag_name: ${{ steps.create_release.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Generate GitHub Release Notes
        id: release_notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          
          VERSION="${TAG#v}"
          
          # 1. Extract curated version notes from CHANGELOG.md
          CHANGELOG_NOTES=$(VERSION="$VERSION" node -e '
            const fs = require("fs");
            const version = process.env.VERSION || "";
            if (fs.existsSync("CHANGELOG.md") && version) {
              const content = fs.readFileSync("CHANGELOG.md", "utf8");
              const regex = new RegExp(`##\\s*\\[v?${version.replace(/\\./g, "\\.")}\\][\\s\\S]*?(?=(?:\\n---|\\n##\\s*\\[|$))`, "i");
              const match = content.match(regex);
              if (match && match[0]) {
                const body = match[0].trim().replace(/^##\\s*\\[[^\\]]+\\][^\n]*/i, "").trim();
                process.stdout.write(body);
              }
            }
          ' 2>/dev/null || true)

          HEADER=$(printf "**Version:** %s\n**Build Number:** %s\n**Commit:** %s" "$VERSION" "${{ github.run_number }}" "${{ github.sha }}")
          
          if [ -n "$CHANGELOG_NOTES" ]; then
            FULL_BODY="${HEADER}"$'\n\n'"${CHANGELOG_NOTES}"
          else
            # 2. Fallback to GitHub auto-generated notes or git log
            NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="$TAG" --jq .body 2>/dev/null || true)
            if [ -n "$NOTES" ]; then
              FULL_BODY="${HEADER}"$'\n\n'"${NOTES}"
            else
              CHANGES=$(git log -n 15 --oneline --no-merges)
              FULL_BODY="${HEADER}"$'\n\n'"### What's Changed"$'\n'"${CHANGES}"
            fi
          fi

          EOF_DELIMITER=$(openssl rand -hex 8)
          {
            echo "body<<${EOF_DELIMITER}"
            echo "$FULL_BODY"
            echo "${EOF_DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Create or Update Draft GitHub Release
        id: create_release
        uses: actions/github-script@v7
        env:
          RELEASE_BODY: ${{ steps.release_notes.outputs.body }}
        with:
          script: |
            const fs = require('fs');
            const ref = context.ref || '';
            let tagName = ref.replace('refs/tags/', '');
            if (!tagName || tagName === ref || tagName === 'main' || !/^v[0-9]/.test(tagName)) {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              tagName = `v${pkg.version}`;
            }
            const releaseName = `ZenohX ${tagName}`;
            const body = process.env.RELEASE_BODY || '';

            let release;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName,
              });
              release = data;
              if (release.draft) {
                await github.rest.repos.updateRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  name: releaseName,
                  body: body,
                });
              }
            } catch (err) {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: releaseName,
                body: body,
                draft: true,
                prerelease: false,
              });
              release = data;
            }

            core.setOutput('release_id', release.id.toString());
            core.setOutput('tag_name', tagName);

  build-tauri:
    name: Build & Package (${{ matrix.name }})
    needs: create-release
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - platform: ubuntu-22.04
            name: Linux x86_64
            args: ''
            target: 'x86_64-unknown-linux-gnu'

          # Linux ARM64 (Native GitHub ARM64 Runner)
          - platform: ubuntu-24.04-arm
            name: Linux ARM64
            args: ''
            target: 'aarch64-unknown-linux-gnu'

          # macOS Universal (Apple Silicon M1-M4 + Intel)
          - platform: macos-latest
            name: macOS Universal
            args: '--target universal-apple-darwin'
            target: 'aarch64-apple-darwin,x86_64-apple-darwin'

          # Windows x86_64
          - platform: windows-latest
            name: Windows x86_64
            args: ''
            target: 'x86_64-pc-windows-msvc'

          # Windows ARM64
          - platform: windows-latest
            name: Windows ARM64
            args: '--target aarch64-pc-windows-msvc'
            target: 'aarch64-pc-windows-msvc'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Desktop App & Sign Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseName: 'ZenohX ${{ needs.create-release.outputs.tag_name }}'
          releaseBody: ${{ needs.create-release.outputs.release_notes }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-release:
    name: Publish Release
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Validate & Sanitize Updater JSON (latest.json)
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            const tagName = process.env.TAG_NAME;
            if (!releaseId || !tagName) return;

            const assets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });

            const latestAsset = assets.data.find((a) => a.name === 'latest.json');
            if (!latestAsset) {
              core.warning('latest.json not found on release assets');
              return;
            }

            // Download existing latest.json
            const response = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: latestAsset.id,
              headers: { accept: 'application/octet-stream' },
            });

            const rawContent = Buffer.from(response.data).toString('utf8');
            let json = JSON.parse(rawContent);
            let modified = false;

            if (json.platforms) {
              for (const [platformKey, platformData] of Object.entries(json.platforms)) {
                if (platformData && typeof platformData.url === 'string') {
                  const originalUrl = platformData.url;
                  const sanitizedUrl = originalUrl
                    .replace(/\/download\/v?__VERSION__\//g, `/download/${tagName}/`)
                    .replace(/\/download\/untagged-[^/]+\//g, `/download/${tagName}/`);
                  if (sanitizedUrl !== originalUrl) {
                    platformData.url = sanitizedUrl;
                    modified = true;
                    core.info(`Sanitized ${platformKey} URL: ${originalUrl} -> ${sanitizedUrl}`);
                  }
                }
              }
            }

            if (modified) {
              const updatedContent = Buffer.from(JSON.stringify(json, null, 2));
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: latestAsset.id,
              });
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: 'latest.json',
                data: updatedContent,
                headers: {
                  'content-type': 'application/json',
                  'content-length': updatedContent.length,
                },
              });
              core.info('Successfully updated and sanitized latest.json asset on release.');
            } else {
              core.info('latest.json URLs are all valid.');
            }

      - name: Publish Draft Release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            if (releaseId) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                draft: false,
              });
            }
